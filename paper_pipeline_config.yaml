# Paper download pipeline configuration.
# Edit the values below (keep the quotes). Use spaces for indentation, never Tab.

# Required by the Unpaywall API — use a real email address of yours.
unpaywall_email: "your_email@example.com"

paths:
  excel_input: "Trial_1.xlsx"
  downloads_dir: "downloads"
  tracking_csv: "download_tracking.csv"

# Column names as they appear in your Excel sheet (case-insensitive match).
excel:
  sheet_name: 0
  doi_column: "DOI"
  title_column: "Title"
  authors_column: "Authors"

network:
  request_delay_seconds: 1.5
  timeout_seconds: 30
  max_retries: 2

# Stage 2 (proxy_download.py) settings. Password is never stored here —
# you'll always be prompted for it at run time.
login:
  # Full URL of your institution's proxy/SSO login page. Leave blank to
  # just log in by hand in the browser window Stage 2 opens (recommended
  # if you're using LibKey below — you'll land on a real article page
  # with a normal institutional login link to click).
  proxy_login_url: ""
  # Leave blank to be prompted for your login ID each run.
  username: ""
  # CSS selectors for the login form fields, only used if proxy_login_url
  # is set above. Defaults match many EZproxy pages; if your institution's
  # page is different, update these.
  username_selector: "input[name='user']"
  password_selector: "input[name='pass']"
  submit_selector: "button[type='submit']"
  # A string that only appears in the page URL/content once you're
  # actually logged in (used to confirm login succeeded automatically).
  success_indicator: ""

# If your institution uses LibKey (libkey.io / LibKey Nomad) for full-text
# access, set your library ID here and the script will build a direct
# https://libkey.io/libraries/<id>/<doi> link for each paper — this is
# usually far more reliable than scraping the publisher's page. Find your
# ID at https://libkey.io/choose-library, or from a libkey.io link you've
# clicked before (it's the number right after "/libraries/").
libkey:
  library_id: "1899"

proxy:
  # EZproxy-style prefix that a publisher URL gets appended to. Only used
  # as a fallback when libkey.library_id above is blank or a paper has no
  # DOI. Example: "https://ezproxy.youruniversity.edu/login?url="
  url_prefix: ""
