# Paper download pipeline configuration.
# Edit the values below (keep the quotes). Use spaces for indentation, never Tab.

# Required by the Unpaywall API — use a real email address of yours.
unpaywall_email: "amitharitwal14@gmail.com"

paths:
  # Drop any number of .xlsx files into this folder (e.g.
  # publication_data_1.xlsx, publication_data_2.xlsx, ...) — every file
  # is read and combined, with duplicates across files counted once.
  # Files are processed in name order, so new files named later in the
  # alphabet append cleanly without renumbering existing entries.
  excel_input_dir: "publication_data"
  # Fallback: used only when the folder above doesn't exist or is empty.
  excel_input: "Trial_1.xlsx"
  downloads_dir: "downloads"
  tracking_csv: "download_tracking.csv"

# Column names as they appear in your Excel sheet (case-insensitive match).
excel:
  sheet_name: 0
  doi_column: "DOI"
  title_column: "Title"
  authors_column: "Authors"

network:
  # Pause between papers. 0.5 is fine for the APIs used (Unpaywall,
  # CrossRef); raise it back toward 1.5 if you ever see rate-limit errors.
  request_delay_seconds: 0.5
  timeout_seconds: 30
  max_retries: 2

# Stage 2 (proxy_download.py) settings. Password is never stored here —
# you'll always be prompted for it at run time.
login:
  # Full URL of your institution's proxy/SSO login page. Leave blank to
  # just log in by hand in the browser window Stage 2 opens (recommended
  # if you're using LibKey below — you'll land on a real article page
  # with a normal institutional login link to click).
  proxy_login_url: ""
  # Leave blank to be prompted for your login ID each run.
  username: "amitkumar.harit@uhasselt.be"
  # CSS selectors for the login form fields, only used if proxy_login_url
  # is set above. Defaults match many EZproxy pages; if your institution's
  # page is different, update these.
  username_selector: "input[name='user']"
  password_selector: "input[name='pass']"
  submit_selector: "button[type='submit']"
  # A string that only appears in the page URL/content once you're
  # actually logged in (used to confirm login succeeded automatically).
  success_indicator: ""

# If your institution uses LibKey (libkey.io / LibKey Nomad) for full-text
# access, set your library ID here and the script will build a direct
# https://libkey.io/libraries/<id>/<doi> link for each paper — this is
# usually far more reliable than scraping the publisher's page. Find your
# ID at https://libkey.io/choose-library, or from a libkey.io link you've
# clicked before (it's the number right after "/libraries/").
libkey:
  library_id: "1899"

proxy:
  # Some institutions (Hasselt included) use a proxy that rewrites the
  # publisher's hostname instead of using a URL prefix: dots become
  # dashes and this suffix is appended, e.g. pubs.acs.org becomes
  # pubs-acs-org.bib-proxy.uhasselt.be. When set, the script builds
  # https://doi-org<suffix>/<doi> directly — this is tried before
  # LibKey, since it's the access path confirmed to actually work.
  # Leave blank if your institution doesn't use this scheme.
  hostname_mangling_suffix: ".bib-proxy.uhasselt.be"

  # EZproxy-style prefix that a publisher URL gets appended to. Only used
  # as a further fallback. Example: "https://ezproxy.youruniversity.edu/login?url="
  url_prefix: ""

# Optional. If a page has a download icon with no visible text or
# accessible label, Stage 2 can find it by its actual appearance instead.
# Save a small, tightly-cropped screenshot of just that icon as it looks
# on the real page (PNG) and point to it here. Leave blank to skip this
# step (falls straight to print-to-PDF instead).
download_icon:
  template_image: ""
  # How close a pixel match has to be (0-1). Lower catches more variation
  # but risks clicking the wrong thing; raise it if it misfires.
  match_threshold: 0.8

# Phase 3 (ask_library.py): the free local AI used to write grounded,
# cited answers. Install Ollama from https://ollama.com, then run
# `ollama pull qwen2.5:7b` once. If Ollama isn't running, ask_library.py
# still works — it returns verbatim passages instead of written answers.
assistant:
  ollama_url: "http://localhost:11434"
  ollama_model: "qwen2.5:7b"

  # Used only when Ollama isn't available and llama-cpp-python is
  # installed instead (pip install llama-cpp-python --extra-index-url
  # https://abetlen.github.io/llama-cpp-python/whl/cpu). The model file
  # downloads once from HuggingFace and is cached.
  gguf_repo: "bartowski/Qwen2.5-7B-Instruct-GGUF"
  gguf_file: "*Q4_K_M.gguf"

# How many papers each run handles before stopping cleanly — the next
# run continues where the previous one left off. Stage 1 counts fresh
# lookups (already-decided rows are skipped for free); Stage 2 counts
# papers attempted in the browser. Set 0 for no limit.
limits:
  stage1_papers_per_run: 2000
  stage2_papers_per_run: 1000
