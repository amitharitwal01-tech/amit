# Paper download pipeline configuration.
# Edit the values below (keep the quotes). Use spaces for indentation, never Tab.

# Required by the Unpaywall API — use a real email address of yours.
unpaywall_email: "your_email@example.com"

paths:
  excel_input: "Trial_1.xlsx"
  downloads_dir: "downloads"
  tracking_csv: "download_tracking.csv"

# Column names as they appear in your Excel sheet (case-insensitive match).
excel:
  sheet_name: 0
  doi_column: "DOI"
  title_column: "Title"
  authors_column: "Authors"

network:
  request_delay_seconds: 1.5
  timeout_seconds: 30
  max_retries: 2

# Stage 2 (proxy_download.py) settings. Password is never stored here —
# you'll always be prompted for it at run time.
login:
  # Full URL of your institution's proxy/SSO login page.
  proxy_login_url: ""
  # Leave blank to be prompted for your login ID each run.
  username: ""
  # CSS selectors for the login form fields. Defaults match many EZproxy
  # pages; if your institution's page is different, update these.
  username_selector: "input[name='user']"
  password_selector: "input[name='pass']"
  submit_selector: "button[type='submit']"
  # A string that only appears in the page URL/content once you're
  # actually logged in (used to confirm login succeeded automatically).
  success_indicator: ""

proxy:
  # EZproxy-style prefix that a publisher URL gets appended to.
  # Example: "https://ezproxy.youruniversity.edu/login?url="
  # Leave blank if your institution uses a different access method
  # (e.g. Shibboleth/SSO) — the script will then rely on the login
  # session already established in the browser.
  url_prefix: ""
